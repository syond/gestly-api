version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gestly-database
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gestlydb
      MYSQL_USER: gestly321
      MYSQL_PASSWORD: gestly321
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: