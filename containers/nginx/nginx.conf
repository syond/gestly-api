events {}

http {
    server {
        listen 80;
        server_name localhost;

        # Root directory for the application
        root /usr/share/nginx/html/public;

        # Default index files
        index index.php index.html index.htm;

        # Handle requests
        location / {
            # Try to serve the requested file or directory
            # If not found, forward to index.php with query parameters
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # Handle PHP files
        location ~ \.php$ {
            # Split the path info for PHP scripts
            fastcgi_split_path_info ^(.+\.php)(/.+)$;

            # Forward PHP requests to PHP-FPM
            fastcgi_pass app:9000;

            # Set the default index file for PHP requests
            fastcgi_index index.php;

            # Include FastCGI parameters
            include fastcgi_params;

            # Set the SCRIPT_FILENAME parameter
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Set the PATH_INFO parameter (optional)
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        # Deny access to .htaccess files (if using Apache)
        location ~ /\.ht {
            deny all;
        }
    }
}